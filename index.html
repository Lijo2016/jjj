
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fogyasztásmérő</title>
<style>
body {
  background:#101820;color:white;font-family:Arial;
  padding:15px;max-width:600px;margin:auto
}
.card {
  background:#1c2935;padding:18px;
  border-radius:14px;margin:15px 0
}
input {
  width:100%;box-sizing:border-box;padding:15px;
  font-size:22px;border-radius:8px;
  background:#263747;color:white;border:1px solid #526477;
  margin:8px 0 15px
}
button {
  padding:13px;border:0;border-radius:8px;
  background:#087e60;color:white;font-size:16px;
  margin:4px;cursor:pointer
}
.value {font-size:32px;color:#50d6a0;font-weight:bold}
.small {color:#aebdca;font-size:13px}
.grid {display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>

<h2 style="color:#50d6a0">⚡ Fogyasztásmérő</h2>

<div class="card">
  <label>Feszültség (V)</label>
  <input id="volt" type="number" value="230" step="0.1">

  <label>Áramerősség (A)</label>
  <input id="amp" type="number" value="0" step="0.01"
  placeholder="Pl. 2.5">
  
  <div class="small">A számolás 1-es teljesítménytényezővel történik.</div>
</div>

<div class="card">
  <div class="small">Teljesítmény</div>
  <div class="value"><span id="watt">0</span> W</div>
</div>

<div class="grid">
  <div class="card">
    <div class="small">Wattperc</div>
    <div class="value" id="wmin">0</div>
    <div class="small">Wm</div>
  </div>
  <div class="card">
    <div class="small">Wattóra</div>
    <div class="value" id="wh">0</div>
    <div class="small">Wh</div>
  </div>
  <div class="card">
    <div class="small">Kilowattóra</div>
    <div class="value" id="kwh">0</div>
    <div class="small">kWh</div>
  </div>
  <div class="card">
    <div class="small">Eltelt idő</div>
    <div class="value" id="time">00:00:00</div>
  </div>
</div>

<div class="card">
  <button onclick="start()">Indítás</button>
  <button onclick="pause()">Szünet</button>
  <button onclick="reset()">Nullázás</button>
  <p id="status" class="small">Készen áll.</p>
</div>

<script>
let running=false;
let lastTime=null;
let energyWh=0;
let elapsed=0;
let timer=null;

const $=id=>document.getElementById(id);

function power(){
  return Math.max(0,Number($("volt").value)*
                     Number($("amp").value.replace(",", "."));

function update(){
  const w=power();

  $("watt").textContent=w.toFixed(2);
  $("wmin").textContent=(energyWh*60).toFixed(3);
  $("wh").textContent=energyWh.toFixed(4);
  $("kwh").textContent=(energyWh/1000).toFixed(6);

  const s=Math.floor(elapsed/1000);
  $("time").textContent=
    String(Math.floor(s/3600)).padStart(2,"0")+":"+
    String(Math.floor(s%3600/60)).padStart(2,"0")+":"+
    String(s%60).padStart(2,"0");
}

function tick(){
  const now=Date.now();

  if(lastTime!==null){
    const dt=(now-lastTime)/1000;
    energyWh+=power()*dt/3600;
    elapsed+=now-lastTime;
  }

  lastTime=now;
  update();
}

function start(){
  if(running)return;
  running=true;
  lastTime=Date.now();
  timer=setInterval(tick,250);
  $("status").textContent="Mérés folyamatban...";
}

function pause(){
  if(!running)return;
  tick();
  running=false;
  clearInterval(timer);
  lastTime=null;
  $("status").textContent="Mérés szüneteltetve.";
}

function reset(){
  pause();
  energyWh=0;
  elapsed=0;
  lastTime=null;
  update();
  $("status").textContent="Nullázva.";
}

$("amp").addEventListener("input",update);
$("volt").addEventListener("input",update);

update();
</script>
</body>
</html>
